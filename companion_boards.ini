; Companion boards this fork releases: one section per row of the README device table.
;
; scripts/companion_boards.py reads this file for the release env list (build.sh and
; the release workflow), the PR build matrix and the README table. To add a board,
; add a section here, then run
;   python3 scripts/companion_boards.py readme --write
;   python3 scripts/companion_boards.py check
; CI (companion-boards.yml) fails when the README table is stale.
;
; Keys:
;   name, note   device name (bold in the README) and an optional plain suffix
;   mcu, display README columns
;   envs         PlatformIO envs to build and release, space separated, in order
;   env_note     optional text after the env list in the README
;   status       the "Fork build" column (hardware tested, build only, experimental)
;   pr_check     envs of this board that the PR build check also compiles

[ci]
; Envs the PR build check compiles that are not released: the V4 TFT touch build
; (the only ui-touch env) and a classic ESP32 to catch S3-only code (#17).
pr_check_extra = heltec_v4_tft_companion_radio_usb_tcp_touch Heltec_v2_companion_radio_ble

