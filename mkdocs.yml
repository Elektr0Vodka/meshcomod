site_name: MeshCore Docs
site_url: https://meshcore-dev.github.io/meshcore/
site_description: Documentation for the open source MeshCore firmware

repo_name: meshcore-dev/meshcore
repo_url: https://github.com/meshcore-dev/meshcore/
edit_uri: edit/main/docs/

theme:
  name: material
  logo: _assets/meshcore.svg
  # Light (the original look) and dark schemes. Colors live in extra.css.
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
  features:
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest

extra_css:
  - _stylesheets/extra.css
