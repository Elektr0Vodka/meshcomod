site_name: meshcomod Docs (Elektr0Vodka fork)
site_url: https://elektr0vodka.github.io/meshcomod/
site_description: Documentation for the Elektr0Vodka fork of meshcomod, the multi-transport MeshCore companion firmware

repo_name: Elektr0Vodka/meshcomod
repo_url: https://github.com/Elektr0Vodka/meshcomod/
edit_uri: edit/main/docs/

theme:
  name: material
  logo: _assets/meshcore.svg
  # Light (the original look) and dark schemes. Colors live in extra.css.
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
  features:
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest

extra_css:
  - _stylesheets/extra.css
