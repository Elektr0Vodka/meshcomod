[env:Station_G3_ESP32_companion_radio_usb]
extends = Station_G3_ESP32
build_flags =
  ${Station_G3_ESP32.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${Station_G3_ESP32.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Station_G3_ESP32.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Station_G3_ESP32_companion_radio_ble]
extends = Station_G3_ESP32
build_flags =
  ${Station_G3_ESP32.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Station_G3_ESP32.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Station_G3_ESP32.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Station G3 (ESP32-S3): meshcomod USB + TCP + WebSocket + BLE companion on the ui-new SH1106 screens.
; The board default is the 4 MB layout; the ~1.6 MB image needs the 16 MB one.
[env:Station_G3_ESP32_companion_radio_usb_tcp]
extends = Station_G3_ESP32
board_build.partitions = default_16MB.csv
extra_scripts = pre:scripts/inject_wifi_env.py, merge-bin.py
build_flags =
  ${Station_G3_ESP32.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ADMIN_PASSWORD='"password"'
  -D MULTI_TRANSPORT_COMPANION=1
  -D TCP_PORT=5000
  -D WS_PORT=8765
  -D BLE_PIN_CODE=123456
  ; Plain ws:// only (no WSS): smaller image, more internal RAM for HTTPS OTA.
  -D CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=1
  -D CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
  -D CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
  ; Optional SNMPv2c agent, off until `set snmp on` (docs/companion_snmp.md).
  -D WITH_SNMP=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Station_G3_ESP32.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Station_G3_ESP32.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0
  0neblock/SNMP_Agent @ 2.1.0

[env:Station_G3_ESP32_companion_radio_wifi]
extends = Station_G3_ESP32
build_flags =
  ${Station_G3_ESP32.build_flags}
  -I examples/companion_radio/ui-new
  -D ENABLE_WIFI_INTERFACE
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
  -D OFFLINE_QUEUE_SIZE=256
; -D MESH_PACKET_LOGGING=1
; -D MESH_DEBUG=1
build_src_filter = ${Station_G3_ESP32.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/wifi/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Station_G3_ESP32.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Station_G3_ESP32_kiss_modem]
extends = Station_G3_ESP32
build_src_filter = ${Station_G3_ESP32.build_src_filter}
  +<../examples/kiss_modem/>
