name: Build Companion Firmwares

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Firmware line, e.g. v1.18.0.1. Leave empty to use FIRMWARE_VERSION from examples/companion_radio/MyMesh.h'
        required: false
        default: ''
      prerelease:
        description: 'Publish the bins as a GitHub pre-release (tag companion-<version>-pre<run number>)'
        type: boolean
        default: false
  push:
    tags:
      - 'companion-*'

jobs:

  # Resolve the version and release tag once, and list the envs to build, so every
  # build runner embeds the same version and the release job knows what to publish.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      envs: ${{ steps.envs.outputs.envs }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      # A tag push uses the tag (companion-v1.18.0.1 -> v1.18.0.1). A manual run
      # would otherwise get the branch name as its version, so it uses the
      # `version` input, or the firmware line in MyMesh.h when that is empty.
      #
      # Pre-releases: a tag with anything after the four-part version
      # (companion-v1.18.0.1-rc1) is published as a pre-release. A manual run
      # with `prerelease` ticked appends -pre<run number> to the version, so the
      # firmware reports it too, and creates the matching companion-* tag.
      - name: Resolve Firmware Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/companion-}"
          elif [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION=$(sed -n 's/^#define FIRMWARE_VERSION "\(.*\)"\r\{0,1\}$/\1/p' examples/companion_radio/MyMesh.h | head -n 1)
          fi
          if [ -z "${VERSION}" ]; then
            echo "Could not resolve the firmware version"
            exit 1
          fi

          RELEASE_TAG=""
          PRERELEASE=false
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
            if ! [[ "${VERSION}" =~ ^v[0-9]+(\.[0-9]+){3}$ ]]; then
              PRERELEASE=true
            fi
          elif [ "${INPUT_PRERELEASE}" = "true" ]; then
            VERSION="${VERSION}-pre${GITHUB_RUN_NUMBER}"
            RELEASE_TAG="companion-${VERSION}"
            PRERELEASE=true
          fi

          echo "Firmware version: ${VERSION}"
          echo "Release tag: ${RELEASE_TAG:-<none>} (pre-release: ${PRERELEASE})"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      # The env list lives in build.sh (MESHCOMOD_COMPANION_ENVS), so adding a board
      # there is enough to build and release it. NOT build-companion-firmwares,
      # which is the entire upstream MeshCore family (60+ envs, wrong variants).
      - name: List Firmwares
        id: envs
        run: |
          ENVS=$(/usr/bin/env bash build.sh get-meshcomod-companion-firmwares-to-build \
                 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Envs: ${ENVS}"
          echo "envs=${ENVS}" >> "$GITHUB_OUTPUT"

  # One runner per firmware, in parallel. fail-fast is off so one broken board still
  # lets the others finish (and shows in the run), but the release job below only
  # runs when every board built: a release never ships with a board missing.
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.prepare.outputs.envs) }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      # Installed platforms and toolchains (espressif32 + Arduino framework are
      # pinned in platformio.ini, so they only change when that file does). Saves
      # the multi-hundred-MB download and unpack on every fresh runner. Compiled
      # objects are not cached: build.sh puts the version and build date into the
      # global flags, which invalidates every object anyway.
      - name: Cache PlatformIO Toolchains
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-toolchains-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-toolchains-${{ runner.os }}-

      # Libraries per env, so lib_deps are not cloned again every run. Keyed on all
      # ini files (any lib_deps change gives a new key and a clean install) and on
      # the in-repo file:// libraries, whose copy in libdeps would otherwise go stale.
      - name: Cache PlatformIO Libraries
        uses: actions/cache@v5
        with:
          path: .pio/libdeps/${{ matrix.env }}
          key: pio-libdeps-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'variants/**/platformio.ini', 'arch/esp32/AsyncElegantOTA/**') }}

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.env }}
        env:
          FIRMWARE_VERSION: ${{ needs.prepare.outputs.version }}
          # Strip debug logging (MESH_DEBUG, BLE_DEBUG_LOGGING, ...) that some envs
          # enable, like the repeater release does. See disable_debug_flags in build.sh.
          DISABLE_DEBUG: '1'
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.env }}

      - name: Upload Firmware
        uses: actions/upload-artifact@v7
        with:
          name: fw-${{ matrix.env }}
          path: out
          if-no-files-found: error

  # Collect every board's output into out/, keep the combined artifact manual runs
  # used to get, and publish the release when there is a tag.
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      FIRMWARE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Download All Firmwares
        uses: actions/download-artifact@v8
        with:
          pattern: fw-*
          merge-multiple: true
          path: out

      - name: List Collected Files
        run: ls -1 out

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: companion-firmwares
          path: out

      # Published (not draft): GitHub Releases are the distribution source of
      # truth — the web flasher reads the release assets directly.
      # A pre-release is never marked "latest", so releases/latest keeps
      # pointing at the newest stable build. target_commitish matters for
      # manual runs: without it the new tag lands on the default branch head
      # instead of the commit that was built.
      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: env.RELEASE_TAG != ''
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Companion Firmware ${{ env.FIRMWARE_VERSION }}
          body: ""
          draft: false
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          files: out/*

      # Rolling retention, counted separately so a run of pre-releases never
      # pushes stable releases out: keep the newest 5 stable and newest 3
      # pre-release companion releases, prune older ones (release + tag + assets).
      - name: Prune old releases (keep last 5 stable, 3 pre-release)
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/env bash scripts/ci/prune-releases.sh "companion-" 5 stable
          /usr/bin/env bash scripts/ci/prune-releases.sh "companion-" 3 prerelease
