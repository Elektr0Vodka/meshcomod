name: PR Build Check

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - 'build.sh'
      - 'scripts/**'
      - '.github/workflows/pr-build-check.yml'
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - 'build.sh'
      - 'scripts/**'
      - '.github/workflows/pr-build-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          # ESP32-S3 (most common platform)
          - Heltec_v3_companion_radio_usb_tcp
          - heltec_v4_companion_radio_usb_tcp
          - heltec_v4_tft_companion_radio_usb_tcp_touch
          # nRF52840, catches fork companion code that only builds on ESP32
          - WioTrackerL1_companion_radio_ble
          # Classic ESP32 (no S3-only registers or USB-CDC), catches S3-only companion code
          - Heltec_v2_companion_radio_ble

    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      # Build through build.sh with the same flags as the release workflow, so the
      # flags it adds (OTA_VARIANT and the manifest OTA code, DISABLE_DEBUG) compile on PRs too.
      - name: Build ${{ matrix.environment }}
        env:
          FIRMWARE_VERSION: v0.0.0.0-pr
          DISABLE_DEBUG: '1'
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.environment }}
