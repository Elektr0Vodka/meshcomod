name: PR Build Check

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - 'build.sh'
      - 'companion_boards.ini'
      - 'scripts/**'
      - '.github/workflows/pr-build-check.yml'
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - 'build.sh'
      - 'companion_boards.ini'
      - 'scripts/**'
      - '.github/workflows/pr-build-check.yml'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.envs.outputs.envs }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      # The list lives in companion_boards.ini: each board's pr_check envs plus
      # [ci] pr_check_extra (the touch build and a classic ESP32).
      - name: List PR check envs
        id: envs
        run: echo "envs=$(python3 scripts/companion_boards.py pr-envs --json)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.prepare.outputs.envs) }}

    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      # Build through build.sh with the same flags as the release workflow, so the
      # flags it adds (OTA_VARIANT and the manifest OTA code, DISABLE_DEBUG) compile on PRs too.
      - name: Build ${{ matrix.environment }}
        env:
          FIRMWARE_VERSION: v0.0.0.0-pr
          DISABLE_DEBUG: '1'
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.environment }}
